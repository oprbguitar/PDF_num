<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Studio</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/sidepanel.css">
</head>
<body class="side">
  <header class="side-head">
    <span class="brand-mark" aria-hidden="true"><svg class="i" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg></span>
    <h1>PDF Studio</h1>
    <span class="muted small">0.2</span>
  </header>

  <section class="drop" id="drop" tabindex="0" role="button" aria-describedby="drop-hint">
    <p class="drop-title">Suelta aquí tus PDF o imágenes</p>
    <p class="muted" id="drop-hint">o pulsa para elegirlos. Nada sale de tu equipo.</p>
  </section>
  <input type="file" id="file-input" accept="application/pdf,.pdf,image/png,image/jpeg" multiple hidden>

  <section class="side-block">
    <div class="side-row"><h3>Documentos</h3><span class="muted small" id="count">0</span></div>
    <ol class="side-list" id="list"></ol>
    <p class="muted side-empty" id="empty">Aún no hay documentos.</p>
  </section>

  <section class="side-block">
    <h3>Abrir en el editor</h3>
    <div class="side-actions">
      <button class="btn block" data-mode="organize"><span>Organizar y combinar</span><span class="kbd">páginas</span></button>
      <button class="btn block" data-mode="edit"><span>Editar</span><span class="kbd">corregir texto · firmar</span></button>
      <button class="btn block" data-mode="folio"><span>Foliar</span><span class="kbd">numerar</span></button>
    </div>
  </section>

  <section class="side-block">
    <button class="btn primary" id="quick-merge" disabled>Combinar en este orden y descargar</button>
    <p class="muted side-note">Une los documentos tal cual. Para reordenar páginas, usa el editor.</p>
  </section>

  <footer class="side-foot">
    <p class="msg" id="status" role="status" aria-live="polite"></p>
    <div class="progress" id="progress" hidden><i></i></div>
    <a href="https://oprbguitar.github.io/PDF_num/" target="_blank" rel="noopener">Guía de uso en línea</a>
  </footer>
  <script type="module" src="js/sidepanel.js"></script>
</body>
</html>
