<!doctype html>
<html lang="es-PE">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Studio</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/app.css">
  <link rel="stylesheet" href="styles/sidepanel.css">
</head>
<body class="side">
  <header class="side-head">
    <span class="brand-mark" aria-hidden="true"></span>
    <h1>PDF Studio</h1>
    <span class="mono muted">sin conexión</span>
  </header>

  <section class="drop" id="drop" tabindex="0" role="button" aria-describedby="drop-hint">
    <p class="drop-title">Suelta aquí tus PDF</p>
    <p class="muted" id="drop-hint">o pulsa para elegirlos. Se procesan solo en este equipo.</p>
  </section>
  <input type="file" id="file-input" accept="application/pdf,.pdf" multiple hidden>

  <section class="side-block">
    <div class="side-row"><h3>Biblioteca temporal</h3><span class="mono muted" id="count">0</span></div>
    <ol class="side-list" id="list"></ol>
    <p class="muted side-empty" id="empty">Aún no hay documentos.</p>
  </section>

  <section class="side-block">
    <h3>Abrir en el editor</h3>
    <div class="side-actions">
      <button class="btn block" data-mode="organize"><span>Organizar y combinar</span><span class="kbd">páginas</span></button>
      <button class="btn block" data-mode="edit"><span>Editar</span><span class="kbd">texto · firma · OCR</span></button>
      <button class="btn block" data-mode="folio"><span>Foliar</span><span class="kbd">numerar</span></button>
    </div>
  </section>

  <section class="side-block">
    <h3>Acción rápida</h3>
    <button class="btn primary block" id="quick-merge" disabled>Combinar en este orden y descargar</button>
    <p class="muted side-note">Une todos los documentos de la lista tal cual. Para reordenar páginas, usa el editor.</p>
  </section>

  <footer class="side-foot">
    <p class="msg" id="status" role="status" aria-live="polite"></p>
    <div class="progress" id="progress" hidden><i></i></div>
  </footer>
  <script type="module" src="js/sidepanel.js"></script>
</body>
</html>
